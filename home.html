<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ternix — Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="home-body">
  <header class="home-header">
    <div class="home-left">
      <div class="brand-mark small">T</div>
      <div>
        <div class="home-title">Ternix</div>
        <div class="home-subtitle">Welcome, <span id="homeUser"></span></div>
      </div>
    </div>

    <button id="logoutBtn" class="secondary-btn">Logout</button>
  </header>

  <main class="home-main">
    <section class="hero">
      <h1>Home</h1>
      <p>Choose a game and play directly in the browser.</p>
    </section>

    <section class="game-grid">
      <article class="game-card">
        <div class="game-thumb arena-thumb">Fight Arena</div>
        <div class="game-info">
          <h2>Fight Arena</h2>
          <p>3D character, movement, jumping and chat.</p>
          <button id="playArenaBtn" class="primary-btn">Play</button>
        </div>
      </article>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="home.js"></script>
</body>
</html>
