<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ternix Home</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="topbar">
    <img src="Ternix.logo.png" class="logo-image">
</div>

<div class="home-wrapper">

    <div class="user-panel">

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

        <h2>
            Welcome,
            <span id="username"></span>
        </h2>

    </div>

    <div class="games-title">
        Games
    </div>

    <div class="game-card">

        <div class="game-banner">
            FIGHT ARENA
        </div>

        <div class="game-info">

            <h3>Fight Arena</h3>

            <p>
                Jump, chat and fight with a sword.
            </p>

            <button class="play-btn" onclick="playArena()">
                Play
            </button>

        </div>

    </div>

</div>

<script>

document.getElementById("username").innerText =
localStorage.getItem("ternix_user");

function playArena(){
    location.href="arena.html";
}

function logout(){
    localStorage.removeItem("ternix_user");
    location.href="index.html";
}

</script>

</body>
</html>
