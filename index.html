<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ternix</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="topbar">

<img
src="Ternix.logo.png"
class="logo-image">

</div>

<div class="login-box">

<h1>Welcome to Ternix</h1>

<p>Create an account or login</p>

<input
id="user"
type="text"
placeholder="Username"
autocomplete="off">

<div class="password-box">

<input
id="pass"
type="password"
placeholder="Password"
autocomplete="off">

<button
type="button"
id="togglePassword"
class="eye-button">

<svg
id="eyeIcon"
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24">

<path
id="eyePath"
fill="currentColor"
d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2.2A1.8 1.8 0 1 0 12 10a1.8 1.8 0 0 0 0 3.6"/>

</svg>

</button>

</div>

<div class="buttons">

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

</div>

</div>

<script src="auth.js"></script>

</body>
</html>
