<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fight Arena</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Verdana;
}

#topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50px;

    background:white;
    border-bottom:2px solid #ccc;

    display:flex;
    align-items:center;

    z-index:10;
}

#exit{
    margin-left:10px;

    background:#ef4444;
    color:white;

    border:none;
    padding:8px 15px;

    cursor:pointer;
}

#player{
    margin-left:auto;
    margin-right:15px;
}

</style>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

</head>
<body>

<div id="topbar">

<button id="exit">
Exit
</button>

<div id="player">
Player:
<span id="username"></span>
</div>

</div>

<script type="module">

import * as THREE from "three";

document.getElementById("username").innerText =
localStorage.getItem("ternix_user");

document.getElementById("exit").onclick=()=>{
location.href="home.html";
};

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87CEEB);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const light =
new THREE.DirectionalLight(
0xffffff,
1
);

light.position.set(10,20,10);

scene.add(light);

scene.add(
new THREE.AmbientLight(
0xffffff,
0.6
)
);

const ground =
new THREE.Mesh(
new THREE.PlaneGeometry(
300,
300
),
new THREE.MeshStandardMaterial({
color:0x55aa55
})
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

/* PLAYER */

const player =
new THREE.Group();

scene.add(player);

const body =
new THREE.Mesh(
new THREE.BoxGeometry(
2,
3,
1
),
new THREE.MeshStandardMaterial({
color:0x2563eb
})
);

body.position.y=1.5;

player.add(body);

const head =
new THREE.Mesh(
new THREE.BoxGeometry(
1.4,
1.4,
1.4
),
new THREE.MeshStandardMaterial({
color:0xffdbac
})
);

head.position.y=4;

player.add(head);

camera.position.set(
0,
8,
10
);

let keys={};

window.addEventListener(
"keydown",
e=>keys[e.key.toLowerCase()]=true
);

window.addEventListener(
"keyup",
e=>keys[e.key.toLowerCase()]=false
);

let velocityY=0;
let grounded=true;

function animate(){

requestAnimationFrame(
animate
);

if(keys["w"])
player.position.z-=0.15;

if(keys["s"])
player.position.z+=0.15;

if(keys["a"])
player.position.x-=0.15;

if(keys["d"])
player.position.x+=0.15;

if(keys[" "] && grounded){

velocityY=0.35;

grounded=false;

}

velocityY-=0.015;

player.position.y+=velocityY;

if(player.position.y<0){

player.position.y=0;

velocityY=0;

grounded=true;

}

camera.position.x=
player.position.x;

camera.position.z=
player.position.z+10;

camera.lookAt(
player.position.x,
player.position.y+3,
player.position.z
);

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{
camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
}
);

</script>

</body>
</html>
