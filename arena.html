```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ternix Fight Arena</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Verdana;
}

#topbar{
position:absolute;
top:0;
left:0;
width:100%;
height:50px;
background:white;
border-bottom:2px solid #ccc;
display:flex;
align-items:center;
z-index:100;
}

#exit{
margin-left:10px;
background:#ef4444;
color:white;
border:none;
padding:8px 15px;
cursor:pointer;
}

#playername{
margin-left:auto;
margin-right:15px;
}

#chat{
position:absolute;
left:10px;
bottom:10px;
width:320px;
z-index:100;
}

#messages{
height:150px;
overflow-y:auto;
background:rgba(0,0,0,0.7);
color:white;
padding:5px;
font-size:14px;
}

#chatInput{
width:100%;
box-sizing:border-box;
padding:8px;
}

</style>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

</head>
<body>

<div id="topbar">

<button id="exit">Exit</button>

<div id="playername">
<span id="username"></span>
</div>

</div>

<div id="chat">

<div id="messages"></div>

<input
id="chatInput"
placeholder='Нажми "/" для чата'
disabled>

</div>

<script type="module">

import * as THREE from "three";

/* UI */

document.getElementById("username").textContent =
localStorage.getItem("ternix_user") || "Guest";

document.getElementById("exit").onclick=()=>{
location.href="home.html";
};

/* SCENE */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({antialias:true});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

/* LIGHT */

scene.add(
new THREE.AmbientLight(
0xffffff,
0.8
)
);

const sun =
new THREE.DirectionalLight(
0xffffff,
1
);

sun.position.set(
20,
40,
20
);

scene.add(sun);

/* GROUND */

const ground =
new THREE.Mesh(
new THREE.PlaneGeometry(
500,
500
),
new THREE.MeshStandardMaterial({
color:0x55aa55
})
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

/* RANDOM BLOCKS */

for(let i=0;i<20;i++){

const block =
new THREE.Mesh(
new THREE.BoxGeometry(
4,
4,
4
),
new THREE.MeshStandardMaterial({
color:0x888888
})
);

block.position.set(
Math.random()*100-50,
2,
Math.random()*100-50
);

scene.add(block);

}

/* PLAYER */

const player =
new THREE.Group();

scene.add(player);

/* BODY */

const body =
new THREE.Mesh(
new THREE.BoxGeometry(
2,
3,
1
),
new THREE.MeshStandardMaterial({
color:0x2563eb
})
);

body.position.y=3;

player.add(body);

/* HEAD */

const head =
new THREE.Mesh(
new THREE.BoxGeometry(
1.5,
1.5,
1.5
),
new THREE.MeshStandardMaterial({
color:0xffdbac
})
);

head.position.y=5.5;

player.add(head);

/* ARMS */

function arm(x){

const a =
new THREE.Mesh(
new THREE.BoxGeometry(
0.7,
2.5,
0.7
),
new THREE.MeshStandardMaterial({
color:0xffdbac
})
);

a.position.set(
x,
3,
0
);

player.add(a);

}

arm(-1.4);
arm(1.4);

/* LEGS */

function leg(x){

const l =
new THREE.Mesh(
new THREE.BoxGeometry(
0.8,
2.5,
0.8
),
new THREE.MeshStandardMaterial({
color:0x1e40af
})
);

l.position.set(
x,
1,
0
);

player.add(l);

}

leg(-0.5);
leg(0.5);

/* MOVEMENT */

let keys={};

window.addEventListener(
"keydown",
e=>{
keys[e.code]=true;
});

window.addEventListener(
"keyup",
e=>{
keys[e.code]=false;
});

let velocityY=0;
let grounded=true;

/* CAMERA */

let camAngle=0;
let mouseDown=false;

window.addEventListener(
"mousedown",
()=>{
mouseDown=true;
});

window.addEventListener(
"mouseup",
()=>{
mouseDown=false;
});

window.addEventListener(
"mousemove",
e=>{

if(mouseDown){

camAngle -=
e.movementX*0.01;

}

});

/* CHAT */

const chatInput =
document.getElementById("chatInput");

const messages =
document.getElementById("messages");

window.addEventListener(
"keydown",
e=>{

if(e.code==="Slash"){

e.preventDefault();

chatInput.disabled=false;

chatInput.focus();

}

});

chatInput.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

if(chatInput.value.trim()){

const div =
document.createElement("div");

div.textContent =
(localStorage.getItem("ternix_user") || "Guest")
+": "
+chatInput.value;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

chatInput.value="";

chatInput.disabled=true;

}

});

/* LOOP */

function animate(){

requestAnimationFrame(
animate
);

const speed=0.18;

if(keys["KeyW"]){

player.position.z-=speed;
player.rotation.y=0;

}

if(keys["KeyS"]){

player.position.z+=speed;
player.rotation.y=Math.PI;

}

if(keys["KeyA"]){

player.position.x-=speed;
player.rotation.y=Math.PI/2;

}

if(keys["KeyD"]){

player.position.x+=speed;
player.rotation.y=-Math.PI/2;

}

if(keys["Space"] && grounded){

velocityY=0.35;
grounded=false;

}

velocityY-=0.015;

player.position.y+=velocityY;

if(player.position.y<0){

player.position.y=0;
velocityY=0;
grounded=true;

}

camera.position.x=
player.position.x+
Math.sin(camAngle)*12;

camera.position.z=
player.position.z+
Math.cos(camAngle)*12;

camera.position.y=
player.position.y+8;

camera.lookAt(
player.position.x,
player.position.y+3,
player.position.z
);

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight);

});

</script>

</body>
</html>
```
