```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ternix Fight Arena</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Verdana;
}

#topbar{
position:absolute;
top:0;
left:0;
width:100%;
height:50px;
background:white;
border-bottom:2px solid #ccc;
display:flex;
align-items:center;
z-index:10;
}

#exit{
margin-left:10px;
background:#ef4444;
color:white;
border:none;
padding:8px 15px;
cursor:pointer;
}

#player{
margin-left:auto;
margin-right:15px;
}

#chat{
position:absolute;
left:10px;
bottom:10px;
width:320px;
z-index:20;
}

#messages{
height:150px;
overflow-y:auto;
background:rgba(0,0,0,0.65);
color:white;
padding:5px;
font-size:14px;
}

#chatInput{
width:100%;
box-sizing:border-box;
padding:8px;
}

</style>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

</head>
<body>

<div id="topbar">

<button id="exit">
Exit
</button>

<div id="player">
Player:
<span id="username"></span>
</div>

</div>

<div id="chat">

<div id="messages"></div>

<input
id="chatInput"
placeholder='Нажми "/" для чата'
disabled>

</div>

<script type="module">

import * as THREE from "three";

document.getElementById("username").innerText =
localStorage.getItem("ternix_user");

document.getElementById("exit").onclick=()=>{
location.href="home.html";
};

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87CEEB);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const light =
new THREE.DirectionalLight(
0xffffff,
1
);

light.position.set(
20,
30,
20
);

scene.add(light);

scene.add(
new THREE.AmbientLight(
0xffffff,
0.7
)
);

const ground =
new THREE.Mesh(
new THREE.PlaneGeometry(
300,
300
),
new THREE.MeshStandardMaterial({
color:0x55aa55
})
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

/* BLOCKS */

for(let i=0;i<25;i++){

const block =
new THREE.Mesh(

new THREE.BoxGeometry(
3,
3,
3
),

new THREE.MeshStandardMaterial({
color:0x888888
})

);

block.position.set(
Math.random()*100-50,
1.5,
Math.random()*100-50
);

scene.add(block);

}

/* PLAYER */

const player =
new THREE.Group();

scene.add(player);

const body =
new THREE.Mesh(
new THREE.BoxGeometry(
2,
3,
1
),
new THREE.MeshStandardMaterial({
color:0x2563eb
})
);

body.position.y=1.5;

player.add(body);

const head =
new THREE.Mesh(
new THREE.BoxGeometry(
1.4,
1.4,
1.4
),
new THREE.MeshStandardMaterial({
color:0xffdbac
})
);

head.position.y=4;

player.add(head);

/* CAMERA */

let cameraAngle = 0;

camera.position.set(
0,
8,
10
);

window.addEventListener(
"mousemove",
(e)=>{

if(e.buttons===1){

cameraAngle +=
e.movementX*0.01;

}

}
);

/* MOVEMENT */

let keys={};

window.addEventListener(
"keydown",
e=>{
keys[e.key.toLowerCase()]=true;
}
);

window.addEventListener(
"keyup",
e=>{
keys[e.key.toLowerCase()]=false;
}
);

let velocityY=0;
let grounded=true;

/* CHAT */

const chatInput =
document.getElementById(
"chatInput"
);

const messages =
document.getElementById(
"messages"
);

window.addEventListener(
"keydown",
(e)=>{

if(e.key==="/"){

e.preventDefault();

chatInput.disabled=false;

chatInput.focus();

}

}
);

chatInput.addEventListener(
"keydown",
(e)=>{

if(e.key==="Enter"){

if(
chatInput.value.trim()
!==""
){

const div =
document.createElement(
"div"
);

div.textContent =
localStorage.getItem(
"ternix_user"
)
+": "
+chatInput.value;

messages.appendChild(
div
);

messages.scrollTop =
messages.scrollHeight;

}

chatInput.value="";

chatInput.disabled=true;

}

}
);

/* LOOP */

function animate(){

requestAnimationFrame(
animate
);

const speed=0.18;

if(keys["w"]){

player.position.z-=speed;
player.rotation.y=0;

}

if(keys["s"]){

player.position.z+=speed;
player.rotation.y=Math.PI;

}

if(keys["a"]){

player.position.x-=speed;
player.rotation.y=Math.PI/2;

}

if(keys["d"]){

player.position.x+=speed;
player.rotation.y=-Math.PI/2;

}

if(keys[" "]&&grounded){

velocityY=0.35;

grounded=false;

}

velocityY-=0.015;

player.position.y+=velocityY;

if(player.position.y<0){

player.position.y=0;

velocityY=0;

grounded=true;

}

camera.position.x=
player.position.x+
Math.sin(cameraAngle)*10;

camera.position.z=
player.position.z+
Math.cos(cameraAngle)*10;

camera.position.y=
player.position.y+8;

camera.lookAt(
player.position.x,
player.position.y+3,
player.position.z
);

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
